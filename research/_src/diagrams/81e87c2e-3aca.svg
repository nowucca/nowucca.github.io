<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-label="Three vendors review the same diff; a verifier, not a vote, decides what stays" font-size="13"><defs><marker id="rev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Three vendors review the same diff; a verifier, not a vote, decides what stays</text><g data-claude-anchor="connectors" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M376 128V152H132V176" marker-end="url(#rev-arrow)"/><path d="M376 152V176" marker-end="url(#rev-arrow)"/><path d="M376 152H620V176" marker-end="url(#rev-arrow)"/><path d="M132 248V272H620V248"/><path d="M376 248V296" marker-end="url(#rev-arrow)"/><path d="M376 384V408" marker-end="url(#rev-arrow)"/><path d="M376 480V504" marker-end="url(#rev-arrow)"/></g><g data-claude-anchor="orchestrator"><rect x="196" y="56" width="360" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="orch-name" x="376" y="80" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Orchestrator: Gemini 4 Neon (High)</text><text data-claude-text-id="orch-l1" x="376" y="98" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Gathers diff, CI checks, open comments, repo rules</text><text data-claude-text-id="orch-l2" x="376" y="114" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Same prompt to all three; no edits, commits or comments</text></g><g data-claude-anchor="reviewer-claude"><rect x="24" y="176" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="claude-name" x="132" y="200" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Claude Fable 5.2 (High)</text><text data-claude-text-id="claude-l1" x="132" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">5 sub-agents, 42 findings</text><text data-claude-text-id="claude-l2" x="132" y="232" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Merge after quick fixes</text></g><g data-claude-anchor="reviewer-codex"><rect x="268" y="176" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="codex-name" x="376" y="200" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">GPT-6.2 Astra (xhigh)</text><text data-claude-text-id="codex-l1" x="376" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">3 sub-agents, 33 findings</text><text data-claude-text-id="codex-l2" x="376" y="232" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Block until fixed</text></g><g data-claude-anchor="reviewer-gemini"><rect x="512" y="176" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="gemini-name" x="620" y="200" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Gemini 4 Neon (xhigh)</text><text data-claude-text-id="gemini-l1" x="620" y="216" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">3 sub-agents</text><text data-claude-text-id="gemini-l2" x="620" y="232" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Block until fixed</text></g><text data-claude-text-id="notes-label" x="386" y="288" font-size="11.5" style="fill:var(--cds-text-secondary)">about 170 KB of notes, split verdict</text><g data-claude-anchor="synthesizer"><rect x="156" y="296" width="440" height="88" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="synth-name" x="376" y="320" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Synthesizer: a separate Gemini 4 Neon (High)</text><text data-claude-text-id="synth-l1" x="376" y="338" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Checks each disagreement and solo high-severity claim</text><text data-claude-text-id="synth-l2" x="376" y="354" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">against the code and official docs</text><text data-claude-text-id="synth-l3" x="376" y="370" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Dropped 2 false positives, kept single-model catches</text></g><g data-claude-anchor="brief"><rect x="156" y="408" width="440" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="brief-name" x="376" y="432" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Fix brief: 41 verified findings</text><text data-claude-text-id="brief-l1" x="376" y="450" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">1 Critical, 10 High, 14 Medium, 16 Low</text><text data-claude-text-id="brief-l2" x="376" y="466" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Agreement score (3/3, 2/3, 1/3) and file:line per finding</text></g><text data-claude-text-id="handoff-label" x="386" y="497" font-size="11.5" style="fill:var(--cds-text-secondary)">handed off; reviewers never write</text><g data-claude-anchor="fix-run"><rect x="256" y="504" width="240" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="fix-name" x="376" y="532" text-anchor="middle" style="fill:var(--cds-text-primary)">Separate parallel fix run</text></g></svg>
