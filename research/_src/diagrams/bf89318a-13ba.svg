<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="One trajectory, one reward: the agentic RL loop" font-size="13"><defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">One trajectory, one reward: the agentic RL loop</text><g data-claude-anchor="connectors" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M164 110H202" marker-end="url(#rl-arrow)"/><path d="M378 110H414" marker-end="url(#rl-arrow)"/><path d="M542 110H562" marker-end="url(#rl-arrow)"/><path d="M478 146V222" marker-end="url(#rl-arrow)"/><path d="M385 250H314V138" marker-end="url(#rl-arrow)"/><path d="M650 138V222" marker-end="url(#rl-arrow)"/><path d="M650 278V312H266V138" marker-end="url(#rl-arrow)"/></g><g data-claude-anchor="step-prompt"><rect x="24" y="82" width="140" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="prompt" x="94" y="106" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Prompt + tools</text><text data-claude-text-id="prompt-sub" x="94" y="124" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">with ground truth</text></g><g data-claude-anchor="step-policy"><rect x="202" y="82" width="176" height="56" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="policy" x="290" y="106" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Policy rollout</text><text data-claude-text-id="policy-sub" x="290" y="124" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">N samples per prompt</text></g><g data-claude-anchor="decision-tool"><polygon points="414,110 478,74 542,110 478,146" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="tool-call" x="478" y="114" text-anchor="middle" style="fill:var(--cds-text-primary)">Tool call?</text></g><g data-claude-anchor="step-score"><rect x="562" y="82" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="score" x="650" y="106" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Score trajectory</text><text data-claude-text-id="score-sub" x="650" y="124" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">answer, tool, format, RM</text></g><g data-claude-anchor="step-mock"><rect x="385" y="222" width="150" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="mock" x="460" y="246" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Mock tool runs</text><text data-claude-text-id="mock-sub" x="460" y="264" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">result appended</text></g><g data-claude-anchor="step-update"><rect x="562" y="222" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="update" x="650" y="246" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Group advantage</text><text data-claude-text-id="update-sub" x="650" y="264" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">GRPO or CISPO, KL to ref</text></g><text data-claude-text-id="yes" x="486" y="174" font-size="11.5" style="fill:var(--cds-text-secondary)">yes</text><text data-claude-text-id="no" x="552" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">no</text><text data-claude-text-id="turns" x="374" y="268" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">up to 3 turns</text><text data-claude-text-id="next-batch" x="450" y="304" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">weights update, next batch</text></svg>
