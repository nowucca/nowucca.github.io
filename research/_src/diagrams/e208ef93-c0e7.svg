<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Agent frame versus workflow frame" font-size="12"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cds-text-secondary, #888)"/></marker></defs><text data-claude-text-id="title" x="20" y="26" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Same job, two frames: the model decides the route, or the files do</text><g data-claude-anchor="agent-frame"><text data-claude-text-id="agent-head" x="30" y="60" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">Agent frame</text><rect x="30" y="74" width="320" height="44" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text data-claude-text-id="agent-persona" x="46" y="101" style="fill:var(--cds-text-primary)">"An agent that does X" (persona, goal, tools)</text><line x1="190" y1="118" x2="190" y2="140" stroke-width="1.5" marker-end="url(#ah)" style="stroke:var(--cds-text-secondary, #888)"/><rect x="30" y="140" width="320" height="70" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text x="46" y="164" style="fill:var(--cds-text-primary)"><tspan data-claude-text-id="orch-1">Orchestration code: memory, handoffs,</tspan><tspan data-claude-text-id="orch-2" x="46" dy="18">tool routing, retries, when-am-I-done logic</tspan></text><line x1="190" y1="210" x2="190" y2="232" stroke-width="1.5" marker-end="url(#ah)" style="stroke:var(--cds-text-secondary, #888)"/><rect x="30" y="232" width="320" height="44" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text data-claude-text-id="agent-model" x="46" y="259" style="fill:var(--cds-text-primary)">Model chooses the next step each turn</text><text x="30" y="306" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="agent-note-1">Hundreds of lines to steer one agent to the</tspan><tspan data-claude-text-id="agent-note-2" x="30" dy="17">right place at the right time (Weinberg's 80%).</tspan></text></g><g data-claude-anchor="workflow-frame"><text data-claude-text-id="wf-head" x="410" y="60" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">Workflow frame</text><rect x="410" y="74" width="320" height="44" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text data-claude-text-id="wf-map" x="426" y="101" style="fill:var(--cds-text-primary)">CLAUDE.md / AGENTS.md: route table per job</text><line x1="570" y1="118" x2="570" y2="140" stroke-width="1.5" marker-end="url(#ah)" style="stroke:var(--cds-text-secondary, #888)"/><rect x="410" y="140" width="150" height="70" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text x="422" y="164" style="fill:var(--cds-text-primary)"><tspan data-claude-text-id="step1-1">Step 1 .md</tspan><tspan data-claude-text-id="step1-2" x="422" dy="18">reads input, uses</tspan><tspan data-claude-text-id="step1-3" x="422" dy="18">script, writes out1</tspan></text><line x1="560" y1="175" x2="580" y2="175" stroke-width="1.5" marker-end="url(#ah)" style="stroke:var(--cds-text-secondary, #888)"/><rect x="580" y="140" width="150" height="70" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text x="592" y="164" style="fill:var(--cds-text-primary)"><tspan data-claude-text-id="step2-1">Step 2 .md</tspan><tspan data-claude-text-id="step2-2" x="592" dy="18">reads out1,</tspan><tspan data-claude-text-id="step2-3" x="592" dy="18">writes gaps.md</tspan></text><line x1="655" y1="210" x2="655" y2="232" stroke-width="1.5" marker-end="url(#ah)" style="stroke:var(--cds-text-secondary, #888)"/><rect x="580" y="232" width="150" height="44" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text data-claude-text-id="owner" x="592" y="259" style="fill:var(--cds-text-primary)">Owner reviews (gate)</text><rect x="410" y="232" width="150" height="44" rx="8" style="fill:var(--cds-background-secondary, #f3f3f3);stroke:var(--cds-border-strong, #888)"/><text data-claude-text-id="runtime" x="422" y="259" style="fill:var(--cds-text-primary)">Model = runtime</text><text x="410" y="306" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="wf-note-1">Every arrow has a verb: reads, uses, writes.</tspan><tspan data-claude-text-id="wf-note-2" x="410" dy="17">Determinism = fixed route + scripts + checks,</tspan><tspan data-claude-text-id="wf-note-3" x="410" dy="17">not the model reading Markdown.</tspan></text></g><line x1="380" y1="50" x2="380" y2="370" stroke-dasharray="4 4" style="stroke:var(--cds-border-strong, #ccc)"/></svg>
