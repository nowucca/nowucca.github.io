<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-label="Only the session log has to survive; brains and hands are disposable" font-size="13"><defs><marker id="ma-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="26" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Only the session log has to survive; brains and hands are disposable</text><g data-claude-anchor="connectors" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M170 96V134" marker-end="url(#ma-arrow)"/><path d="M170 300V330" marker-end="url(#ma-arrow)"/><path d="M300 230H438" marker-end="url(#ma-arrow)"/></g><g data-claude-anchor="orchestrator"><rect x="40" y="44" width="260" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="orch-name" x="56" y="65" font-weight="600" style="fill:var(--cds-text-primary)">Orchestrator</text><text data-claude-text-id="orch-body" x="56" y="82" font-size="11.5" style="fill:var(--cds-text-secondary)">wake(sessionId) boots a fresh harness</text></g><text data-claude-text-id="replays" x="180" y="120" font-size="11.5" style="fill:var(--cds-text-secondary)">getSession replays the log</text><g data-claude-anchor="brain"><rect x="40" y="136" width="260" height="164" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="brain-name" x="56" y="158" font-weight="600" style="fill:var(--cds-text-primary)">Brain</text><rect x="56" y="172" width="228" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="claude-name" x="72" y="193" font-weight="600" style="fill:var(--cds-text-primary)">Claude</text><text data-claude-text-id="claude-body" x="72" y="210" font-size="11.5" style="fill:var(--cds-text-secondary)">the model: plans and calls tools</text><rect x="56" y="236" width="228" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="harness-name" x="72" y="257" font-weight="600" style="fill:var(--cds-text-primary)">Harness</text><text data-claude-text-id="harness-body" x="72" y="274" font-size="11.5" style="fill:var(--cds-text-secondary)">stateless loop; any copy can resume</text></g><text data-claude-text-id="emit" x="180" y="320" font-size="11.5" style="fill:var(--cds-text-secondary)">emitEvent / getEvents</text><g data-claude-anchor="session"><rect x="40" y="332" width="260" height="60" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="session-name" x="56" y="354" font-weight="600" style="fill:var(--cds-text-primary)">Session log</text><text data-claude-text-id="session-body" x="56" y="372" font-size="11.5" style="fill:var(--cds-text-primary)">append-only events: the only state</text></g><text data-claude-text-id="execute" x="370" y="220" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">execute(name, input)</text><text data-claude-text-id="returns" x="370" y="248" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">returns a string</text><g data-claude-anchor="hands"><rect x="440" y="136" width="296" height="232" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="hands-name" x="456" y="158" font-weight="600" style="fill:var(--cds-text-primary)">Hands: interchangeable</text><rect x="456" y="172" width="264" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="sandbox-name" x="472" y="193" font-weight="600" style="fill:var(--cds-text-primary)">Sandbox container</text><text data-claude-text-id="sandbox-body" x="472" y="210" font-size="11.5" style="fill:var(--cds-text-secondary)">provisioned only when a call needs it</text><rect x="456" y="236" width="264" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="mcp-name" x="472" y="257" font-weight="600" style="fill:var(--cds-text-primary)">MCP proxy + vault</text><text data-claude-text-id="mcp-body" x="472" y="274" font-size="11.5" style="fill:var(--cds-text-secondary)">tokens fetched outside the sandbox</text><rect x="456" y="300" width="264" height="52" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="custom-name" x="472" y="321" font-weight="600" style="fill:var(--cds-text-primary)">Custom tools</text><text data-claude-text-id="custom-body" x="472" y="338" font-size="11.5" style="fill:var(--cds-text-secondary)">your code, behind the same call</text></g><text data-claude-text-id="note" x="24" y="424" font-size="11.5" style="fill:var(--cds-text-secondary)">A dead container comes back as a tool error; Claude can retry on a fresh one. A dead harness is replaced from the log.</text></svg>
