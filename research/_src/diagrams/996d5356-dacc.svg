<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-label="Every job you did in the loop now has an owner, but only some owners give guarantees" font-size="13"><defs><marker id="jobs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Every loop job now has an owner; only some give guarantees</text><text data-claude-text-id="h-job" x="24" y="72" font-size="11.5" font-weight="600" style="fill:var(--cds-text-secondary)">YOU USED TO</text><text data-claude-text-id="h-mech" x="272" y="72" font-size="11.5" font-weight="600" style="fill:var(--cds-text-secondary)">NOW HANDLED BY</text><text data-claude-text-id="h-guar" x="616" y="72" font-size="11.5" font-weight="600" style="fill:var(--cds-text-secondary)">GUARANTEE</text><g data-claude-anchor="connectors"><path d="M224 128H272" fill="none" stroke-width="1.25" marker-end="url(#jobs-arrow)" style="stroke:var(--cds-chart-axis)"/><path d="M224 216H272" fill="none" stroke-width="1.25" marker-end="url(#jobs-arrow)" style="stroke:var(--cds-chart-axis)"/><path d="M224 304H272" fill="none" stroke-width="1.25" marker-end="url(#jobs-arrow)" style="stroke:var(--cds-chart-axis)"/><path d="M224 392H272" fill="none" stroke-width="1.25" marker-end="url(#jobs-arrow)" style="stroke:var(--cds-chart-axis)"/><path d="M224 480H272" fill="none" stroke-width="1.25" marker-end="url(#jobs-arrow)" style="stroke:var(--cds-chart-axis)"/></g><g data-claude-anchor="row-steer"><rect x="24" y="104" width="200" height="48" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="j-steer" x="124" y="132" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Steer and correct</text><rect x="272" y="92" width="324" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="m-steer" x="284" y="116" font-weight="600" style="fill:var(--cds-text-primary)">Model (Opus 5.5)</text><text font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="m-steer-1" x="284" y="134">Infers intent from the code; CLAUDE.md keeps</tspan><tspan data-claude-text-id="m-steer-2" x="284" y="150">only what the code cannot show</tspan></text><text data-claude-text-id="g-steer" x="616" y="132" font-weight="600" style="fill:var(--cds-chart-status-warning)">Probabilistic</text></g><g data-claude-anchor="row-approve"><rect x="24" y="192" width="200" height="48" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="j-approve" x="124" y="220" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Approve each command</text><rect x="272" y="180" width="324" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="m-approve" x="284" y="204" font-weight="600" style="fill:var(--cds-text-primary)">Harness: auto-mode classifier</text><text font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="m-approve-1" x="284" y="222">Blocks uncertain actions; trusts only this</tspan><tspan data-claude-text-id="m-approve-2" x="284" y="238">repo by default; blocked 89% in a study</tspan></text><text data-claude-text-id="g-approve" x="616" y="220" font-weight="600" style="fill:var(--cds-chart-status-warning)">Probabilistic</text></g><g data-claude-anchor="row-deny"><rect x="24" y="280" width="200" height="48" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="j-deny" x="124" y="308" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Say no</text><rect x="272" y="268" width="324" height="72" rx="8" fill-opacity="0.1" stroke-width="1.5" style="fill:var(--cds-chart-status-good);stroke:var(--cds-chart-status-good)"/><text data-claude-text-id="m-deny" x="284" y="292" font-weight="600" style="fill:var(--cds-text-primary)">Deny rules + sandbox or cloud session</text><text font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="m-deny-1" x="284" y="310">Deny rules run before the classifier; the OS</tspan><tspan data-claude-text-id="m-deny-2" x="284" y="326">or a secret-free machine limits side effects</tspan></text><text data-claude-text-id="g-deny" x="616" y="308" font-weight="600" style="fill:var(--cds-chart-status-good)">Deterministic</text></g><g data-claude-anchor="row-check"><rect x="24" y="368" width="200" height="48" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="j-check" x="124" y="396" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Check the output</text><rect x="272" y="356" width="324" height="72" rx="8" fill-opacity="0.1" stroke-width="1.5" style="fill:var(--cds-chart-status-good);stroke:var(--cds-chart-status-good)"/><text data-claude-text-id="m-check" x="284" y="380" font-weight="600" style="fill:var(--cds-text-primary)">Tests, hooks and CI</text><text font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="m-check-1" x="284" y="398">Pass/fail checkpoints; hooks exit 2 to block;</tspan><tspan data-claude-text-id="m-check-2" x="284" y="414">Claude reviews PRs first, humans by risk</tspan></text><text data-claude-text-id="g-check" x="616" y="396" font-weight="600" style="fill:var(--cds-chart-status-good)">Deterministic</text></g><g data-claude-anchor="row-start"><rect x="24" y="456" width="200" height="48" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="j-start" x="124" y="484" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Start every session</text><rect x="272" y="444" width="324" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="m-start" x="284" y="468" font-weight="600" style="fill:var(--cds-text-primary)">Projects coordinator</text><text font-size="11.5" style="fill:var(--cds-text-secondary)"><tspan data-claude-text-id="m-start-1" x="284" y="486">Fable 5.2 splits and judges; Opus 5.5 threads</tspan><tspan data-claude-text-id="m-start-2" x="284" y="502">do the work; unfinished work goes back</tspan></text><text data-claude-text-id="g-start" x="616" y="484" font-weight="600" style="fill:var(--cds-chart-status-warning)">Model-judged</text></g><text data-claude-text-id="foot" x="24" y="548" font-size="11.5" style="fill:var(--cds-text-secondary)">Green rows are enforced by the harness or the operating system; amber rows depend on a model getting it right.</text></svg>
