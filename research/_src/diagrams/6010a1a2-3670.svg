<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" aria-label="Every step is logged, so a crash replays to the last step, not the start" font-size="13"><defs><marker id="de-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Every step is logged, so a crash replays to the last step, not the start</text><g data-claude-anchor="entity"><rect x="24" y="56" width="712" height="72" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="entity-name" x="40" y="80" font-weight="600" style="fill:var(--cds-text-primary)">SkuAgent: one long-lived entity workflow per SKU</text><text data-claude-text-id="entity-a" x="40" y="98" font-size="11.5" style="fill:var(--cds-text-secondary)">Checks stock, starts a replenishment, forwards manager and supplier signals to it</text><text data-claude-text-id="entity-b" x="40" y="114" font-size="11.5" style="fill:var(--cds-text-secondary)">continue_as_new resets its history so the log stays bounded</text></g><g data-claude-anchor="connectors" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M380 128V168" marker-end="url(#de-arrow)"/><path d="M164 236H179" marker-end="url(#de-arrow)"/><path d="M303 236H318" marker-end="url(#de-arrow)"/><path d="M442 236H457" marker-end="url(#de-arrow)"/><path d="M581 236H596" marker-end="url(#de-arrow)"/><path d="M658 272V296H519V272" marker-end="url(#de-arrow)"/><path d="M380 332V352" marker-end="url(#de-arrow)"/></g><text data-claude-text-id="starts-child" x="392" y="152" font-size="11.5" style="fill:var(--cds-text-secondary)">starts a child workflow, forwards signals</text><g data-claude-anchor="child"><rect x="24" y="168" width="712" height="164" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="child-name" x="40" y="190" font-weight="600" style="fill:var(--cds-text-primary)">Replenish: one workflow per replenishment, finishes when done</text></g><g data-claude-anchor="step-quotes"><rect x="40" y="200" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="quotes" x="102" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Gather quotes</text><text data-claude-text-id="quotes-a" x="102" y="242" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">model and tools,</text><text data-claude-text-id="quotes-b" x="102" y="258" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">each call a step</text></g><g data-claude-anchor="step-draft"><rect x="179" y="200" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="draft" x="241" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Draft PO</text><text data-claude-text-id="draft-a" x="241" y="242" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">rules_version</text><text data-claude-text-id="draft-b" x="241" y="258" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">pinned at start</text></g><g data-claude-anchor="step-approval"><rect x="318" y="200" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="approval" x="380" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Approval wait</text><text data-claude-text-id="approval-a" x="380" y="242" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">manager signal,</text><text data-claude-text-id="approval-b" x="380" y="258" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">price + 5% cap</text></g><g data-claude-anchor="step-order"><rect x="457" y="200" width="124" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="order" x="519" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Place order</text><text data-claude-text-id="order-a" x="519" y="242" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">re-check price</text><text data-claude-text-id="order-b" x="519" y="258" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">PO no. as key</text></g><g data-claude-anchor="step-supplier"><rect x="596" y="200" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="supplier" x="658" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Supplier wait</text><text data-claude-text-id="supplier-a" x="658" y="242" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">7-day timeout,</text><text data-claude-text-id="supplier-b" x="658" y="258" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">then chase</text></g><text data-claude-text-id="cancel" x="588" y="316" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">duplicate seen: cancel_order (saga)</text><text data-claude-text-id="harness-note" x="40" y="316" font-size="11.5" style="fill:var(--cds-text-secondary)">Highlighted: where the harness, not the runtime, keeps it correct</text><g data-claude-anchor="log"><rect x="24" y="352" width="712" height="52" rx="8" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"/><text data-claude-text-id="log-a" x="40" y="374" font-weight="600" style="fill:var(--cds-text-primary)">Durable log: each step's input and output, written before the next step runs</text><text data-claude-text-id="log-b" x="40" y="392" font-size="11.5" style="fill:var(--cds-text-secondary)">After a crash, replay returns recorded results and runs the first unrecorded step for real</text></g></svg>
