<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-label="Expert accuracy only clears the trivial baseline once experts audit agents" font-size="12"><text data-claude-text-id="title" x="20" y="28" font-size="16" style="fill:var(--cds-text-primary)">Experts only beat the trivial baseline once they audit agents</text><text data-claude-text-id="sub" x="20" y="50" style="fill:var(--cds-text-secondary)">DeepFact micro-gold accuracy (%) after each Audit-then-Score round, 143 known-answer claims</text><g data-claude-anchor="bars"><g><text x="20" y="94" style="fill:var(--cds-text-primary)">Round 0</text><text x="20" y="110" font-size="11" style="fill:var(--cds-text-secondary)">Experts alone</text><rect x="300" y="84" width="243.20000000000005" height="26" style="fill:var(--cds-chart-muted)"><title>Round 0, Experts alone: 60.8%</title></rect><text x="712" y="102" style="fill:var(--cds-text-primary)">60.8%</text></g><g><text x="20" y="140" style="fill:var(--cds-text-primary)">Round 1</text><text x="20" y="156" font-size="11" style="fill:var(--cds-text-secondary)">Experts audit SmolAgents (GPT-4.1)</text><rect x="300" y="130" width="321.6" height="26" style="fill:var(--cds-chart-muted)"><title>Round 1, Experts audit SmolAgents (GPT-4.1): 80.4%</title></rect><text x="712" y="148" style="fill:var(--cds-text-primary)">80.4%</text></g><g><text x="20" y="186" style="fill:var(--cds-text-primary)">Round 2</text><text x="20" y="202" font-size="11" style="fill:var(--cds-text-secondary)">Experts audit DeepFact-Eval (GPT-4.1)</text><rect x="300" y="176" width="341.20000000000005" height="26" style="fill:var(--cds-chart-categorical-1)"><title>Round 2, Experts audit DeepFact-Eval (GPT-4.1): 85.3%</title></rect><text x="712" y="194" style="fill:var(--cds-text-primary)">85.3%</text></g><g><text x="20" y="232" style="fill:var(--cds-text-primary)">Round 3</text><text x="20" y="248" font-size="11" style="fill:var(--cds-text-secondary)">Experts audit DeepFact-Eval (GPT-5)</text><rect x="300" y="222" width="363.6" height="26" style="fill:var(--cds-chart-categorical-1)"><title>Round 3, Experts audit DeepFact-Eval (GPT-5): 90.9%</title></rect><text x="712" y="240" style="fill:var(--cds-text-primary)">90.9%</text></g></g><g data-claude-anchor="baseline"><line x1="635.6" x2="635.6" y1="74" y2="264" stroke-dasharray="4 3" style="stroke:var(--cds-chart-reference)"><title>Always answer unsupported: 83.9%</title></line><text x="635.6" y="282" text-anchor="middle" font-size="11" style="fill:var(--cds-text-secondary)">Always answer unsupported: 83.9%</text></g><g data-claude-anchor="x-axis"><line x1="300" x2="300" y1="74" y2="264" style="stroke:var(--cds-chart-axis)"/></g></svg>
