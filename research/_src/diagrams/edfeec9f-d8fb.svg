<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Each stage commits an artifact the next stage reads" font-size="13"><defs><marker id="sdlc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Each stage commits an artifact the next stage reads</text><g data-claude-anchor="connectors" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M240 96H270" marker-end="url(#sdlc-arrow)"/><path d="M488 96H518" marker-end="url(#sdlc-arrow)"/><path d="M628 132V198" marker-end="url(#sdlc-arrow)"/><path d="M520 236H490" marker-end="url(#sdlc-arrow)"/><path d="M272 236H242" marker-end="url(#sdlc-arrow)"/><path d="M132 200V134" marker-end="url(#sdlc-arrow)"/></g><g data-claude-anchor="stage-plan"><rect x="24" y="60" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="plan" x="132" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1 Plan</text><text data-claude-text-id="plan-artifact" x="132" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">commits intent.md</text><text data-claude-text-id="plan-gate" x="132" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">gate: product owner accepts</text></g><g data-claude-anchor="stage-design"><rect x="272" y="60" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="design" x="380" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2 Design</text><text data-claude-text-id="design-artifact" x="380" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">commits spec.md</text><text data-claude-text-id="design-gate" x="380" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">gate: product owner signs off</text></g><g data-claude-anchor="stage-build"><rect x="520" y="60" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="build" x="628" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">3 Build</text><text data-claude-text-id="build-artifact" x="628" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">commits plan.md, then the diff</text><text data-claude-text-id="build-gate" x="628" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">gate: engineer approves plan</text></g><g data-claude-anchor="stage-test"><rect x="520" y="200" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="test" x="628" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">4 Test</text><text data-claude-text-id="test-artifact" x="628" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">tests and evals run in CI</text><text data-claude-text-id="test-gate" x="628" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">agent cannot edit the tests</text></g><g data-claude-anchor="stage-deploy"><rect x="272" y="200" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="deploy" x="380" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">5 Deploy</text><text data-claude-text-id="deploy-artifact" x="380" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">PR with review findings</text><text data-claude-text-id="deploy-gate" x="380" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">gates: code owner, release</text></g><g data-claude-anchor="stage-maintain"><rect x="24" y="200" width="216" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="maintain" x="132" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">6 Maintain</text><text data-claude-text-id="maintain-artifact" x="132" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">band breach or scheduled scan</text><text data-claude-text-id="maintain-gate" x="132" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">writes a new intent.md</text></g><text data-claude-text-id="loop-closes" x="142" y="172" font-size="11.5" style="fill:var(--cds-text-secondary)">loop closes, no human starts it</text></svg>
