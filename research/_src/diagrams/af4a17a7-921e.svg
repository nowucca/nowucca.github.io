<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Only the gate grants authority; subscriptions only add context" font-size="13"><defs><marker id="sa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"/></marker><marker id="sa-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"/></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Only the gate grants authority; subscriptions only add context</text><g data-claude-anchor="source"><rect x="24" y="60" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="source-name" x="120" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Source</text><text data-claude-text-id="source-l1" x="120" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">GitHub, Feishu events</text><text data-claude-text-id="source-l2" x="120" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">drops own and dup events</text></g><g data-claude-anchor="thread"><rect x="284" y="60" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="thread-name" x="380" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Thread</text><text data-claude-text-id="thread-l1" x="380" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Triggers in time order</text><text data-claude-text-id="thread-l2" x="380" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">one Eval at a time</text></g><g data-claude-anchor="eval"><rect x="544" y="60" width="192" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="eval-name" x="640" y="84" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Eval (main Session)</text><text data-claude-text-id="eval-l1" x="640" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">gate: code decides who</text><text data-claude-text-id="eval-l2" x="640" y="116" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">assessment: model judges</text></g><g data-claude-anchor="ticket"><rect x="284" y="200" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="ticket-name" x="380" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Ticket + Mandate</text><text data-claude-text-id="ticket-l1" x="380" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">scope, strength, policy ver.</text><text data-claude-text-id="ticket-l2" x="380" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">immutable; wider = new Ticket</text></g><g data-claude-anchor="executor"><rect x="24" y="200" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="executor-name" x="120" y="224" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Executor</text><text data-claude-text-id="executor-l1" x="120" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">own Session + directory</text><text data-claude-text-id="executor-l2" x="120" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">reports ready or blocked</text></g><g data-claude-anchor="connectors"><line x1="216" y1="96" x2="284" y2="96" stroke-width="1.25" marker-end="url(#sa-arrow)" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="lbl-trigger" x="250" y="88" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Trigger</text><line x1="476" y1="96" x2="544" y2="96" stroke-width="1.25" marker-end="url(#sa-arrow)" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="lbl-batch" x="510" y="88" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">batch</text><path d="M640 132 L640 236 L476 236" fill="none" stroke-width="2" marker-end="url(#sa-arrow-accent)" style="stroke:var(--cds-chart-categorical-1)"/><text data-claude-text-id="lbl-accept" x="648" y="176" font-size="11.5" style="fill:var(--cds-text-primary)">accept</text><text data-claude-text-id="lbl-accept-2" x="648" y="192" font-size="11.5" style="fill:var(--cds-text-secondary)">(ignore: recorded)</text><line x1="380" y1="132" x2="380" y2="200" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#sa-arrow)" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="lbl-fanout" x="388" y="162" font-size="11.5" style="fill:var(--cds-text-secondary)">fan-out: context,</text><text data-claude-text-id="lbl-fanout-2" x="388" y="178" font-size="11.5" style="fill:var(--cds-text-secondary)">no new authority</text><line x1="284" y1="236" x2="216" y2="236" stroke-width="1.25" marker-end="url(#sa-arrow)" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="lbl-assign" x="250" y="228" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Assignment</text><line x1="120" y1="200" x2="120" y2="132" stroke-width="1.25" marker-end="url(#sa-arrow)" style="stroke:var(--cds-chart-axis)"/><text data-claude-text-id="lbl-channel" x="128" y="162" font-size="11.5" style="fill:var(--cds-text-secondary)">replies via</text><text data-claude-text-id="lbl-channel-2" x="128" y="178" font-size="11.5" style="fill:var(--cds-text-secondary)">Channel</text></g></svg>
